name: Android Diag

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Gradle diagnose
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          bash ./gradlew lintDebug --no-daemon --stacktrace > /tmp/lint.log 2>&1
          echo "lint exit=$?"
          exit 0

      - name: Emit AAPT resource errors as annotations
        if: always()
        run: |
          echo "--- AAPT error lines ---"
          grep -aE "AAPT: error" /tmp/lint.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          echo "--- other resource/style errors ---"
          grep -aE "error: resource|not found\.|resource .* not found" /tmp/lint.log | grep -av "AAPT: error" | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          echo "--- task failures ---"
          grep -aE "> Task .* FAILED|Execution failed for task|What went wrong" /tmp/lint.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0
