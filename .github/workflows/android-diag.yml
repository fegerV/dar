name: Android Diag

# TEMPORARY diagnostic workflow, only present on the throwaway ci-diag branch.
# It runs the three Gradle tasks the real workflows use and republishes the
# failure lines as check-run annotations, which are readable through the public
# REST API (raw job logs are not). Delete the branch once CI is green.

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          for t in lintDebug assembleDebug testDebugUnitTest; do
            bash ./gradlew "$t" --no-daemon --stacktrace > "/tmp/$t.log" 2>&1
            echo "$t exit=$?"
          done
          exit 0

      - name: Annotate results
        if: always()
        run: |
          for t in lintDebug assembleDebug testDebugUnitTest; do
            if grep -qa "BUILD SUCCESSFUL" "/tmp/$t.log"; then
              echo "::notice::$t SUCCEEDED"
            else
              grep -aE "^e: |error: |Unresolved reference|not found\.|Execution failed for task|Could not resolve|Could not find|Caused by:|There were failing tests|What went wrong" "/tmp/$t.log" | head -3 | while IFS= read -r line; do echo "::error::$t | $line"; done
            fi
          done
          exit 0
