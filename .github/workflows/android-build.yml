name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DARAGENT_SIGNING_KEY: ${{ secrets.DARAGENT_SIGNING_KEY != '' }}
      DARAGENT_SIGNING_STORE_PASSWORD: ${{ secrets.DARAGENT_SIGNING_STORE_PASSWORD }}
      DARAGENT_SIGNING_KEY_ALIAS: ${{ secrets.DARAGENT_SIGNING_KEY_ALIAS }}
      DARAGENT_SIGNING_KEY_PASSWORD: ${{ secrets.DARAGENT_SIGNING_KEY_PASSWORD }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # The ubuntu-latest image already ships the Android SDK and exports
      # ANDROID_HOME / ANDROID_SDK_ROOT. android-actions/setup-android@v3 now fails
      # there (it still targets Node 20, which the runner forces onto Node 24), which
      # aborted the job before Gradle ever ran. Locate the pre-installed SDK instead.
      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found (looked in $SDK)"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDK"
          ls "$SDK"

      # Optional: app/google-services.json is not committed, so restore it from the
      # GOOGLE_SERVICES_JSON secret when that secret exists. app/build.gradle applies the
      # google-services plugin only if the file is present.
      - name: Provide google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Import signing keystore
        if: env.DARAGENT_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.DARAGENT_SIGNING_KEY }}" | base64 -d > android/daragent-release.jks
          echo "Keystore imported successfully"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run tests
        run: |
          cd android
          bash ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          cd android
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd android
          bash ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn
