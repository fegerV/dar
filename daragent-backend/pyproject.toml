[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "N999", # Invalid module name (daragent-backend directory has hyphen)
  "B008", # Depends() in default args (common FastAPI pattern)
  "BLE001", # Blind except (acceptable in some cases)
]
