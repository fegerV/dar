plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

// The google-services plugin hard-fails when app/google-services.json is missing.
// That file holds Firebase project credentials and is deliberately not committed,
// so the plugin is applied only when the file is actually present (locally, or
// materialised from the GOOGLE_SERVICES_JSON CI secret). Without it the app still
// compiles and every other feature works; only FCM push stays disabled.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.daragent'
    compileSdk 34

    defaultConfig {
        applicationId "com.daragent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "BUILD_TYPE_CI", "true"
        // RetrofitClient reads com.daragent.BuildConfig.API_BASE_URL. The field used to be
        // declared only in the (now removed) build.gradle.kts, so the Groovy build file that
        // Gradle actually applies left the reference unresolved. The value matches the base
        // URL data/network/NetworkModule.kt already uses.
        buildConfigField "String", "API_BASE_URL", "\"https://api.daragent.ru/api/v1/\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        release {
            if (project.hasProperty("DARAGENT_SIGNING_KEY")) {
                storeFile file("daragent-release.jks")
                storePassword System.getenv("DARAGENT_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("DARAGENT_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("DARAGENT_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty("DARAGENT_SIGNING_KEY")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    // --- CI fix: deps required by the sources but missing from this build file ---
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-android-compiler:2.48'
    implementation 'androidx.hilt:hilt-navigation-compose:1.1.0'
    implementation 'io.coil-kt:coil-compose:2.5.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    // res/values-night/themes.xml inherits Theme.Material3.DayNight.NoActionBar and sets the
    // Material colour attributes (colorPrimaryVariant, colorOnPrimary, colorSecondary,
    // colorOnSecondary). Those resources live in this library, so without it AAPT2 aborts with
    // "error: resource style/Theme.Material3.DayNight.NoActionBar not found".
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.1.2'
    implementation 'androidx.navigation:navigation-compose:2.7.5'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.browser:browser:1.8.0'
    // Rive animation library - commented out due to repository availability issues
    // implementation 'app.rive:rive:5.13.0'
    implementation 'com.airbnb.android:lottie-compose:6.3.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    // Test libraries that src/test actually imports. The set matches the intent recorded in
    // the (now removed) app/build.gradle.kts; without them testDebugUnitTest cannot compile.
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'app.cash.turbine:turbine:1.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // androidTest sources build Retrofit with GsonConverterFactory (main sources use Moshi).
    androidTestImplementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}

kapt {
    correctErrorTypes = true
}
