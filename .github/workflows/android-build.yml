name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DARAGENT_SIGNING_KEY: ${{ secrets.DARAGENT_SIGNING_KEY != '' }}
      DARAGENT_SIGNING_STORE_PASSWORD: ${{ secrets.DARAGENT_SIGNING_STORE_PASSWORD }}
      DARAGENT_SIGNING_KEY_ALIAS: ${{ secrets.DARAGENT_SIGNING_KEY_ALIAS }}
      DARAGENT_SIGNING_KEY_PASSWORD: ${{ secrets.DARAGENT_SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Import signing keystore
        if: env.DARAGENT_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.DARAGENT_SIGNING_KEY }}" | base64 -d > android/daragent-release.jks
          echo "Keystore imported successfully"

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run tests
        run: |
          cd android
          bash ./gradlew test

      - name: Build debug APK
        run: |
          cd android
          bash ./gradlew assembleDebug

      - name: Build release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd android
          bash ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: release-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7
          fail-on-error: false
